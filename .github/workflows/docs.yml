name: documentation

# The user documentation lives on GitBook (https://docs.sevenpens.com/opentabletartist),
# synced from TheSevenPens/OpenTabletArtistDocs. This workflow only keeps the old
# GitHub Pages URLs alive: every page of the former MkDocs site redirects to its
# GitBook counterpart, because released app builds still link there.

on:
  push:
    branches: [master]
    paths:
      - 'docs/site-redirects/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Upload redirects
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site-redirects

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Publish redirects
        id: deployment
        uses: actions/deploy-pages@v5
