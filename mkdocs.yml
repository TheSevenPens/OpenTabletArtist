site_name: OpenTabletArtist
site_description: Setup, user guides, and troubleshooting for OpenTabletArtist.
site_url: https://thesevenpens.github.io/OpenTabletArtist/
docs_dir: docs/user
site_dir: site

# Existing app releases link to this repository file; it only points to the docs home.
exclude_docs: |
  /USERMANUAL.md

theme:
  name: material
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: pink
      accent: pink
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: pink
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

extra_css:
  - stylesheets/navigation.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

# Only docs/user is published. Every user guide should be discoverable in the
# sidebar; missing pages, broken document links, and anchors fail the strict build.
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Get started:
      - About OTA: index.md
      - Install on Windows: INSTALL.md
  - Use OTA:
      - Home: HOME.md
      - Tablet: TABLET.md
      - Pen: PEN.md
      - Scribble: SCRIBBLE.md
      - Settings: SETTINGS.md
      - Advanced: ADVANCED.md
  - Get help:
      - Troubleshooting: TROUBLESHOOTING.md
      - Ask for help: HELP.md
      - Advanced information: ADVANCED-INFORMATION.md
      - Uninstall OTA: UNINSTALL.md
