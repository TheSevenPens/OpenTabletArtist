site_name: OpenTabletArtist
site_description: Setup, user guides, and developer documentation for OpenTabletArtist.
site_url: https://thesevenpens.github.io/OpenTabletArtist/
repo_url: https://github.com/TheSevenPens/OpenTabletArtist
repo_name: TheSevenPens/OpenTabletArtist
edit_uri: edit/master/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: pink
      accent: pink
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: pink
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

# Design notes and past releases remain published and searchable, without adding
# every historical page to the sidebar. Broken document links still fail CI.
validation:
  nav:
    omitted_files: ignore
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Documentation: README.md
  - Get started:
      - About OTA: OVERVIEW.md
      - Install on Windows: user/INSTALL.md
      - Quick start and user manual: user/USERMANUAL.md
  - Use OTA:
      - Home: user/HOME.md
      - Tablet and mapping: user/TABLET.md
      - Pen and pressure: user/PEN.md
      - Scribble: user/SCRIBBLE.md
      - Settings: user/SETTINGS.md
      - Presets: user/PRESETS.md
      - Plugins: user/PLUGINS.md
      - Advanced controls: user/ADVANCED.md
  - Get help:
      - Troubleshooting: user/TROUBLESHOOTING.md
      - Ask for help: user/HELP.md
  - Development:
      - Build from source: dev/BUILDING.md
      - Architecture: dev/ARCHITECTURE.md
      - Developer tools: user/DEVELOPER.md
      - Diagnostics: dev/DIAGNOSTICS.md
      - Device matrix: dev/DEVICE-MATRIX.md
      - Roadmap: dev/FUTURES.md
      - OTD suggestions: dev/OTD-SUGGESTIONS.md
      - OTD defects: dev/OTD-DEFECTS.md
      - Design notes: design/README.md
      - Release notes: release-notes/README.md
      - Maintain this site: dev/DOCUMENTATION.md
  - Third-party notices: THIRD_PARTY_NOTICES.md
